name: Bug report
description: Something in Notula doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please don't report security issues here: see [SECURITY.md](https://github.com/augusto-dmh/notula/blob/main/SECURITY.md).
        Leave out anything private: meeting content, names, keys and tokens.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new note
        2. …
  - type: input
    id: version
    attributes:
      label: Notula version
      description: Settings ▸ About.
      placeholder: 0.0.13
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Transcription
        - Notes and AI
        - Editor and library
        - Calendar and integrations
        - Dictation
        - Sources (Labs)
        - Install and updates
        - Other
  - type: textarea
    id: setup
    attributes:
      label: Transcription and AI setup
      description: On-device or cloud transcription, and which AI provider, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Settings ▸ Troubleshooting collects diagnostic logs. Check them for private content before you paste.
