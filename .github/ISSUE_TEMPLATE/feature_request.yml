name: Feature request
description: An idea that would make Notula better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Describe it in Notula's own terms.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead
