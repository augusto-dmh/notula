<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-label="Word error rate by lecture, lower is better. Notula: 12.0, 16.8, 17.9 and 19.3 percent. Other app A: 21.0, 49.8, 36.4 and 42.2 percent.">
