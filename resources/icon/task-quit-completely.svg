<!-- Jump list "Quit Completely": the power symbol with a stop mark (a square) at its lower right, cut free by a gap. Original drawing for Notula. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <mask id="gap">
      <rect width="24" height="24" fill="#fff" />
      <rect x="11.5" y="11.5" width="13" height="13" rx="2.5" fill="#000" />
    </mask>
  </defs>
  <g fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round" mask="url(#gap)">
    <path d="M10.5 1.75v7.5" />
    <path d="M14.9 4.9A7 7 0 1 1 6.1 4.9" />
  </g>
  <rect x="14" y="14" width="8.5" height="8.5" rx="1.5" fill="#808080" />
</svg>
